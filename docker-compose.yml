version: "3.8"
services:
  vlc-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - RACK_ENV=production
    networks:
      - vlc-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  vlc-server:
    driver: bridge
